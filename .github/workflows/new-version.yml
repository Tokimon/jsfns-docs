name: New JSFNS version responder

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to rebuild against (e.g. @jsfns/core@1.2.2)'
        required: true
  repository_dispatch:
    types: [new-version]

jobs:
  new-jsfns-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.ACCESS_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: latest
          cache: pnpm

      - name: Parse dispatched tag
        id: parse
        run: |
          TAG="${{ github.event.client_payload.tag || github.event.inputs.tag }}"
          SPEC="${TAG#@jsfns/}"
          echo "spec=$SPEC" >> "$GITHUB_OUTPUT"

      - name: Install
        run: pnpm install

      - name: Build
        env:
          BASE_PATH: /jsfns
        run: pnpm build ${{ steps.parse.outputs.spec }}

      - name: Deploy to jsfns gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.ACCESS_TOKEN }}
          external_repository: Tokimon/jsfns
          publish_branch: gh-pages
          publish_dir: ./docs
